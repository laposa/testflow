name: login_with_valid_credentials
suite: authentication
description: User can log in with valid credentials.
steps:
  - action: [ "Open the login page" ]
    result: [ "Login form is shown" ]
  - action:
      - "Enter the username"
      - "Enter the password"
      - "Press Sign in"
    input:
      username: { description: "Valid user", value: "qa@example.com" }
      password: { description: "Their password", value: 12345 }
      locale: en
    result:
      - "The dashboard is shown"
      - "The user's name is in the header"
