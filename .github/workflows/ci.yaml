# Go CI (spec §12): the same steps as `make check` in app-go/, with Postgres
# as a service container instead of the compose stack.
#
# Runs on pull requests and on pushes to every branch except master. On
# master, build-image.yaml calls this workflow before it builds the image,
# so the checks run once and no image is published from a failing commit.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - master
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-go
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: testflow
          POSTGRES_PASSWORD: testflow
          POSTGRES_DB: testflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testflow -d testflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: app-go/go.sum

      - name: Lint (gofmt, go vet)
        run: make lint

      - name: Unit and handler tests
        run: make test

      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://testflow:testflow@localhost:5432/testflow?sslmode=disable
        run: go test -count=1 ./...

      - name: Build
        run: make build
