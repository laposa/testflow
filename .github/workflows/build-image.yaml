# Image build (spec §12): on push to master, build both apps in one run.
#
#   - legacy Laravel app from app/   -> laposa/testflow
#   - Go app from app-go/            -> laposa/testflow-go (a separate image)
#
# Both get the tags latest and master-YYMMDD.<sha>. The Go image is built only
# after CI (ci.yaml) passes for the commit. Replaces build-app.yaml.
name: Build images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yaml

  tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate new image tag
        id: tag
        run: |
          DATE=$(date +%y%m%d)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "image_tag=master-${DATE}.${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

  build-legacy:
    needs: tag
    runs-on: ubuntu-latest
    environment: Dev
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:app"
          push: true
          tags: |
            laposa/testflow:latest
            laposa/testflow:${{ needs.tag.outputs.image_tag }}

  build-go:
    needs: [check, tag]
    runs-on: ubuntu-latest
    environment: Dev
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The Go build stage is a Docker Hardened Image (deploy/Dockerfile);
      # dhi.io takes the same Docker Hub account.
      - name: Login to Docker Hardened Images
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:app-go"
          file: deploy/Dockerfile
          build-args: |
            VERSION=${{ needs.tag.outputs.image_tag }}
          push: true
          tags: |
            laposa/testflow-go:latest
            laposa/testflow-go:${{ needs.tag.outputs.image_tag }}
